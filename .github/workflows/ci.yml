name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test:
    name: Build + test + lint + typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Skip the postinstall Playwright browser fetch — the TUI doesn't
      # need it for tests/lints, and downloading Chromium would balloon
      # CI time without catching anything these jobs look at.
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      # shared has no dependencies and only emits types — core + tui both
      # need it before they can build/typecheck.
      - name: Build shared
        run: pnpm --filter @thisisayande/freecode-shared build

      # turbo walks every workspace, picks up `lint`, `check-types`, and
      # `test` from packages that declare them. Adding a script to a new
      # package is enough to opt in — no edit here.
      - name: Lint
        run: pnpm turbo run lint

      - name: Typecheck
        run: pnpm turbo run check-types

      - name: Build
        run: pnpm turbo run build

      # core and tui run under the test-count guard: it fails when a suite
      # runs no tests, or fewer tests or test files than
      # .github/test-baselines.json records, which a green exit code cannot
      # show. Deleting tests on purpose: `node scripts/test-guard.mjs --update
      # core tui`. Growth only prints that the baseline is stale.
      - name: Test guard self-check
        run: node --test scripts/test-guard.test.mjs

      - name: Test (core + tui, count-guarded)
        run: node scripts/test-guard.mjs core tui

      # Every other package's tests, as before: a new package opts in by
      # adding a `test` script. Give it a baseline by adding it to SUITES in
      # scripts/test-guard.mjs.
      - name: Test (other packages)
        run: pnpm turbo run test --filter='!@thisisayande/freecode-core' --filter='!@thisisayande/freecode'

      # Drives the real TUI in tmux, each test with its own throwaway HOME:
      # boot, the / menu, /help, /exit, Ctrl+C. No model call (the live turn
      # needs FREECODE_E2E_LIVE=1 and a key). The suite refuses to skip under
      # CI, so tmux must be present.
      - name: TUI e2e (tmux)
        run: |
          command -v tmux >/dev/null || (sudo apt-get update && sudo apt-get install -y tmux)
          pnpm -C apps/tui test:e2e